services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    read_only: false
    security_opt:
      - no-new-privileges:true
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
      # Limit Erlang VM to 2 schedulers and cap heap to reduce CPU
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+P 1000000 -S 2:2 +sbwt very_short +subp very_short -MMS 128"
      # Force Erlang to use limited memory and reduce GC pressure
      ERL_MAX_PORTS: 65536
      ERL_MAX_ETS_TABLES: 4096
      ERL_CRASH_DUMP: /dev/null
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./definitions.json:/etc/rabbitmq/definitions.json:ro
    tmpfs:
      - /var/log/rabbitmq
    networks:
      - red-compartida
    expose:
      - "5672"
      - "15672"
    cpus: 0.75
    mem_limit: 768m
    mem_reservation: 384m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  rabbitmq_data:

networks:
  red-compartida:
    external: true
    name: red-compartida
