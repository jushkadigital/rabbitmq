services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_DEFAULT_VM_MEMORY_HIGH_WATERMARK: "0.4"
      RABBITMQ_DEFAULT_DISK_FREE_LIMIT: "2GB"
      RABBITMQ_DEFAULT_HEARTBEAT: "60"
      RABBITMQ_NUMBER_OF_ACCEPTORS: "2"
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 1:1 +A 5 +stbt db"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    tmpfs:
      - /var/log/rabbitmq
    networks:
      - red-compartida
    expose:
      - "5672"
      - "15672"
    cpus: 0.3
    mem_limit: 384m
    mem_reservation: 256m
    pids_limit: 100
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  rabbitmq_data:

networks:
  red-compartida:
    external: true
    name: red-compartida
