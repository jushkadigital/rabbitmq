services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
      RABBITMQ_DEFAULT_VM_MEMORY_HIGH_WATERMARK: "0.6"
      RABBITMQ_DEFAULT_DISK_FREE_LIMIT: "1GB"
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2 +sbwt very_short"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    tmpfs:
      - /var/log/rabbitmq
    networks:
      - red-compartida
    expose:
      - "5672"
      - "15672"
    cpus: 0.5
    mem_limit: 512m
    mem_reservation: 256m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  rabbitmq_data:

networks:
  red-compartida:
    external: true
    name: red-compartida
