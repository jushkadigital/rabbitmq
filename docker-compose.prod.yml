services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    hostname: rabbitmq
    restart: always
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
      RABBITMQ_DEFAULT_VM_MEMORY_HIGH_WATERMARK: "0.6"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    tmpfs:
      - /var/log/rabbitmq
    networks:
      - red-compartida
    expose:
      - "5672"
      - "15672"
    cpus: 1.5
    mem_limit: 1.5g
    mem_reservation: 512m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
volumes:
  rabbitmq_data:

networks:
  red-compartida:
    external: true
    name: red-compartida
