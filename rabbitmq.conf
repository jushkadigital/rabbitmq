# ============================================
# RabbitMQ Production Config - Low CPU VPS
# ============================================

# --- Networking ---
# Disable reverse DNS lookups (big CPU saver)
reverse_dns_lookup = false
# Use TCP for inter-node if clustering needed
tcp_listen_options.backlog = 128
tcp_listen_options.nodelay = true
tcp_listen_options.sndbuf = 98304
tcp_listen_options.recbuf = 98304

# --- Memory ---
# Page to disk at 40% of VM memory limit
vm_memory_high_watermark.relative = 0.4
# Absolute fallback (256MB) for safety on small VPS
vm_memory_high_watermark_paging_ratio = 0.5

# --- Disk ---
# Block producers if disk drops below 1GB
disk_free_limit.absolute = 1GB

# --- Connection Limits (prevent abuse) ---
# Max 512 connections - enough for most services on a VPS
# Set via rabbitmq.conf; override per-vhost if needed
# channel_max = 2048

# --- Queue Limits ---
# Default max queue length per queue
default_consumer.prefetch = 250

# --- Management Plugin (lower stats interval = less CPU) ---
# Publish interval in ms for stats - higher = less CPU
management.collect_statistics_interval = 30000

# --- Erlang VM Tuning ---
# handled via RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS in docker-compose

# --- Consumer Timeout ---
# Kill slow consumers after 30 minutes
consumer_timeout = 1800000
